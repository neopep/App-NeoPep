name: NeoPep Connect Windows

on:
  push:
    branches: [desenvolvimento/connect-windows-02, desenvolvimento/connect-whatsapp-grupos, desenvolvimento/connect-windows-campanhas-v026, desenvolvimento/connect-dois-ambientes]
    paths: ['connect/windows/**', 'connect/whatsapp-lab/**', '.github/workflows/neopep-connect.yml']
  pull_request:
    branches: [staging/permanente, desenvolvimento/connect-windows-02, desenvolvimento/connect-windows-campanhas-v025]
    paths: ['connect/windows/**', 'connect/whatsapp-lab/**', '.github/workflows/neopep-connect.yml']
  workflow_dispatch:
    inputs:
      upload_candidate:
        description: 'Anexar o candidato sem chave oficial à execução'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    if: contains(fromJSON('["desenvolvimento/connect-windows-02","desenvolvimento/connect-whatsapp-grupos","desenvolvimento/connect-windows-campanhas-v026","desenvolvimento/connect-windows-026-integracao-staging","desenvolvimento/connect-dois-ambientes"]'), github.event.pull_request.head.ref || github.ref_name)
    env:
      CONNECT_TEST_VERSION: ${{ (github.event.pull_request.head.ref || github.ref_name) == 'desenvolvimento/connect-dois-ambientes' && '0.2.7' || contains(fromJSON('["desenvolvimento/connect-windows-campanhas-v026","desenvolvimento/connect-windows-026-integracao-staging"]'), (github.event.pull_request.head.ref || github.ref_name)) && '0.2.6' || (github.event.pull_request.head.ref || github.ref_name) == 'desenvolvimento/connect-whatsapp-grupos' && '0.2.4' || '0.2.2' }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          architecture: x64
      - name: Validar broker Connect de Produção (somente código, sem deploy)
        shell: powershell
        run: |
          node --test connect/windows/production-update-contract.test.cjs
          if ($LASTEXITCODE) { throw 'Contrato do broker de Produção inválido' }
      - name: Instalar e auditar dependências de runtime
        working-directory: connect/whatsapp-lab
        shell: powershell
        run: |
          npm ci --omit=dev --ignore-scripts
          if ($LASTEXITCODE) { throw 'npm ci falhou' }
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE) { throw 'Auditoria npm falhou' }
          npm test
          if ($LASTEXITCODE) { throw 'Testes do bridge falharam' }
      - name: Testar autenticidade e rejeição de pacote alterado
        shell: powershell
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $test = Join-Path $env:RUNNER_TEMP 'UpdateTrustTest.exe'
          $source = (Resolve-Path 'connect/windows').Path
          & $compiler /nologo /platform:x64 "/out:$test" /r:System.Web.Extensions.dll /r:System.Security.dll "$source\ConnectProfile.cs" "$source\UpdateTrust.cs" "$source\UpdateTrustTest.cs"
          if ($LASTEXITCODE) { throw 'Falha ao compilar teste do atualizador' }
          & $test
          if ($LASTEXITCODE) { throw 'Falha na verificacao de autenticidade' }
      - name: Compilar aplicativo e instalador x64
        shell: powershell
        run: ./connect/windows/build.ps1 -Perfil Teste -Version $env:CONNECT_TEST_VERSION -Output "$env:RUNNER_TEMP\connect"
      - name: Verificar tema, prévia e rascunho protegido de campanha
        if: env.CONNECT_TEST_VERSION == '0.2.6' || env.CONNECT_TEST_VERSION == '0.2.7'
        shell: powershell
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'connect\NeoPepConnect.exe'
          $binary = [Reflection.Assembly]::Load([IO.File]::ReadAllBytes($exe))
          $flags = [Reflection.BindingFlags]'Instance,NonPublic'
          $static = [Reflection.BindingFlags]'Static,NonPublic'
          $theme = $binary.GetType('ConnectTheme',$true)
          $theme.GetMethod('Select',$static).Invoke($null,@('Claro'))
          if (!$theme.GetField('Light',$static).GetValue($null)) { throw 'Tema claro não aplicado.' }
          if (!$binary.GetManifestResourceInfo('NeoPepBrand')) { throw 'Marca ausente.' }
          $type = $binary.GetType('WhatsApp',$true)
          $profile = Join-Path $env:RUNNER_TEMP 'connect-composer-fixture'
          New-Item -ItemType Directory -Path $profile | Out-Null
          $ctorArgs = New-Object object[] 8
          $ctorArgs.SetValue($profile.PSObject.BaseObject,0)
          $ctorArgs.SetValue($false,1)
          $ctorArgs.SetValue($true,6)
          $form = $type.GetConstructors()[0].Invoke($ctorArgs)
          try {
            $message = $type.GetField('messageText',$flags).GetValue($form)
            $title = $type.GetField('campaignTitle',$flags).GetValue($form)
            $preview = $type.GetField('previewText',$flags).GetValue($form)
            $title.Text = 'Campanha ficticia'
            $message.Text = "Linha 1`r`nLinha 2"
            if ($preview.Text -notmatch 'Campanha ficticia' -or $preview.Text -notmatch "Linha 1`r`nLinha 2") { throw 'Prévia divergente.' }
            if (!$type.GetMethod('SaveCampaignDraft',$flags).Invoke($form,$null)) { throw 'Falha no rascunho protegido.' }
            $message.Clear()
            $type.GetMethod('LoadDraft',$flags).Invoke($form,$null)
            if ($message.Text -ne "Linha 1`r`nLinha 2") { throw 'Rascunho restaurado incorretamente.' }
          } finally {
            $form.Dispose()
            Remove-Item -LiteralPath $profile -Recurse -Force
          }
      - name: Verificar checksum, instalação, migração legada e remoção
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'connect'
          $setup = Join-Path $output 'NeoPepConnectSetup.exe'
          $client = Join-Path $output 'NeoPepConnect.exe'
          $manifest = Get-Content (Join-Path $output 'manifest.json') -Raw | ConvertFrom-Json
          if ((Get-FileHash $setup).Hash.ToLowerInvariant() -ne $manifest.sha256) { throw 'Checksum incorreto' }
          if ((Get-Item $setup).Length -ne $manifest.bytes) { throw 'Tamanho incorreto' }
          if ($manifest.version -ne $env:CONNECT_TEST_VERSION -or $manifest.profile -ne 'staging' -or !$manifest.connect_enabled -or $manifest.commit -ne (git rev-parse HEAD) -or $manifest.run_id -ne $env:GITHUB_RUN_ID -or $manifest.run_attempt -ne $env:GITHUB_RUN_ATTEMPT) { throw 'Identidade incorreta do candidato' }
          Write-Host ("EXE SHA-256 " + $manifest.sha256)
          Write-Host ("EXE bytes " + $manifest.bytes)
          Write-Host ("EXE commit " + $manifest.commit)
          Write-Host ("EXE run " + $manifest.run_id + "/" + $manifest.run_attempt)
          if (@($manifest.supported_profiles).Count -ne 2 -or 'production' -notin $manifest.supported_profiles) { throw 'Perfis ausentes no instalador' }
          Write-Host ("Authenticode " + $manifest.authenticode)
          function Invoke-Setup([string]$binary,[string]$arguments) {
            $execution = Start-Process $binary -ArgumentList $arguments -Wait -PassThru
            if ($execution.ExitCode -ne 0) { throw "Falha no instalador: $($execution.ExitCode)" }
          }
          $folder = Join-Path $env:LOCALAPPDATA 'NeoPep Connect'
          $installed = Join-Path $folder 'NeoPepConnect.exe'
          $vault = Join-Path $folder 'session.dat'
          Add-Type -AssemblyName System.Security
          foreach ($baseline in @(
            @{version='0.1.1'; commit='4264a48c8503b4c2749b25ef25e5de4af67691c6'},
            @{version='0.1.2'; commit='60016a98f6d8ef526a8ad2f04a27e0d57ec879c4'},
            @{version='0.2.6'; commit='fa8429a22b0639f5ab9d48614cd6458ada29ceb0'}
          )) {
            $worktree = Join-Path $env:RUNNER_TEMP ('baseline-' + $baseline.version)
            git worktree add --detach $worktree $baseline.commit
            if ($LASTEXITCODE) { throw 'Linha de base ausente' }
            $baselineOutput = Join-Path $worktree 'output'
            $baselineBuild = Join-Path $worktree 'connect/windows/build.ps1'
            if ($baseline.version -eq '0.2.6') {
              $modules = (Resolve-Path 'connect/whatsapp-lab/node_modules').Path
              $target = Join-Path $worktree 'connect/whatsapp-lab/node_modules'
              New-Item -ItemType Junction -Path $target -Target $modules | Out-Null
              & $baselineBuild -Output $baselineOutput -Version '0.2.6'
            } else { & $baselineBuild -Output $baselineOutput }
            Invoke-Setup (Join-Path $baselineOutput 'NeoPepConnectSetup.exe') '--quiet'
            $fixture = '{"device":"fixture-windows","account":"fixture-principal"}'
            $bytes = [Text.Encoding]::UTF8.GetBytes($fixture)
            [IO.File]::WriteAllBytes($vault,[Security.Cryptography.ProtectedData]::Protect($bytes,$null,'CurrentUser'))
            $previousHash = (Get-FileHash $vault).Hash
            $waVault = Join-Path $folder 'whatsapp-session.dat'
            [IO.File]::WriteAllBytes($waVault,[Security.Cryptography.ProtectedData]::Protect($bytes,$null,'CurrentUser'))
            $previousWaHash = (Get-FileHash $waVault).Hash
            Invoke-Setup $setup '--quiet'
            if ((Get-FileHash $installed).Hash -ne (Get-FileHash $client).Hash) { throw 'Binario instalado diverge' }
            if ((Get-FileHash $vault).Hash -ne $previousHash) { throw "A atualizacao alterou o cofre $($baseline.version)" }
            if ((Get-FileHash $waVault).Hash -ne $previousWaHash) { throw "A atualização alterou a sessão WhatsApp legada." }
            Write-Host ("Cofre preservado apos atualizar " + $baseline.version)
          }
          $productionVault = Join-Path $folder 'profiles\production\session.dat'
          if ((Test-Path $productionVault) -or (Test-Path (Join-Path $folder 'profiles\production\whatsapp-session.dat'))) { throw 'O instalador criou um cofre de produção na migração' }
          if (!(Test-Path (Join-Path $folder ("NeoPepUpdate-"+$env:CONNECT_TEST_VERSION+".exe")))) { throw 'Auxiliar ausente' }
          if ($manifest.updater_trust_configured) { throw 'A CI nao deve incorporar chaves de teste' }
          $runtime = Join-Path $folder ('whatsapp-runtime-'+$env:CONNECT_TEST_VERSION)
          & (Join-Path $runtime 'node.exe') --check (Join-Path $runtime 'bridge/windows-bridge.mjs')
          if ($LASTEXITCODE) { throw 'Bridge empacotado inválido' }
          Push-Location (Join-Path $runtime 'bridge')
          try {
            & (Join-Path $runtime 'node.exe') -e "import('@whiskeysockets/baileys').catch(() => process.exit(2))"
            if ($LASTEXITCODE) { throw 'Dependências empacotadas inválidas' }
          } finally { Pop-Location }
          $app = Start-Process $installed -ArgumentList '--background' -PassThru
          try {
            if ($app.WaitForExit(2000)) { throw 'Cliente WinForms encerrou durante a inicialização' }
          } finally {
            if (!$app.HasExited) { $app.Kill(); $app.WaitForExit() }
          }
          Invoke-Setup $setup '--quiet --uninstall'
          if ((Test-Path $installed) -or (Test-Path $runtime)) { throw 'Arquivos ativos permanecem instalados' }
          if ((Get-FileHash $vault).Hash -ne $previousHash) { throw 'Remoção alterou o cofre legado' }
      - name: Construir e verificar o par assinado com chave descartável
        if: env.CONNECT_TEST_VERSION == '0.2.2'
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Subject 'CN=NeoPep Connect Teste Update Signing' -CertStoreLocation 'Cert:\CurrentUser\My' -Provider 'Microsoft Software Key Storage Provider' -KeyAlgorithm RSA -KeyLength 3072 -KeyExportPolicy NonExportable -KeyUsage DigitalSignature -Type Custom -NotAfter (Get-Date).AddDays(1)
          try {
            ./connect/windows/prepare-update-trial.ps1 -Output "$env:RUNNER_TEMP\connect-signed-trial" -SigningThumbprint $cert.Thumbprint
          } finally {
            Remove-Item -LiteralPath ("Cert:\CurrentUser\My\"+$cert.Thumbprint) -DeleteKey -ErrorAction Stop
            Remove-Item "$env:RUNNER_TEMP\connect-signed-trial" -Recurse -Force -ErrorAction SilentlyContinue
          }
      - if: github.event.repository.private && (github.event_name == 'workflow_dispatch' && inputs.upload_candidate || github.event_name == 'push' && env.CONNECT_TEST_VERSION == '0.2.4')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NeoPep-Connect-${{ env.CONNECT_TEST_VERSION }}-Teste-Windows-x64-candidato
          path: |
            ${{ runner.temp }}/connect/NeoPepConnectSetup.exe
            ${{ runner.temp }}/connect/manifest.json
          retention-days: 7
