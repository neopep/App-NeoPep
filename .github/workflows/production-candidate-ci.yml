name: Production Candidate CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Candidata sem deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Invariantes de configuracao oficial
        run: node release/production/assert-candidate.cjs
      - name: Testes focalizados
        run: node --test tests/{admin-ui,admin-pdf,community-ui,core,library-files-ui,library-sharing,ui,pwa,release-check,cloud,auth-persistence,photos,shop-payments-edge,shop-core,shop,shop-shipping,auth-settings,delete-account,production-finance-baseline,push-prod-campaign,agent-prod-preview}.test.cjs
      - name: Suíte completa da candidata
        run: npm test
      - name: Ensaio sintético dos lotes e catálogo
        run: |
          node --test tests/production-rehearsal.test.cjs
          node release/production/test-catalog.cjs
          node --test tests/production-invariants.test.cjs
      - name: Autoteste offline de integridade do Storage restaurado
        run: python3 release/production/verify-storage-restore.py --self-test
      - name: Auditoria de dependencias
        run: npm audit --omit=dev --audit-level=high

  # A PR #83 sincroniza somente codigo que ja esta publicado em Producao.
  # Todos os outros PRs continuam sujeitos ao gate de prontidao publica.
  sync-gate:
    name: Gate da sincronizacao auditada (sem novo release)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 83 && github.head_ref == 'preparacao/auditoria-final-producao-20261125' }}
    needs: [candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Garantir mesmo codigo funcional ja publicado
        env:
          PUBLISHED_SHA: 5f96533ee00452a1a6e3d6eb28284e587b18457d
        run: |
          set -euo pipefail
          git cat-file -e "${PUBLISHED_SHA}^{commit}"
          git merge-base --is-ancestor "$PUBLISHED_SHA" HEAD
          mapfile -t changes < <(git diff --name-only "$PUBLISHED_SHA" HEAD)
          if [[ "${#changes[@]}" -ne 2 ]]; then
            echo "::error::Sincronizacao exige exatamente dois arquivos de controle alterados."
            printf '%s\n' "${changes[@]}"
            exit 1
          fi
          for path in "${changes[@]}"; do
            case "$path" in
              ".github/workflows/production-candidate-ci.yml"|"vercel.json") ;;
              *) echo "::error::Arquivo funcional alterado: $path"; exit 1 ;;
            esac
          done
          node <<'NODE'
          const fs=require('node:fs');
          const {execFileSync}=require('node:child_process');
          const baseline=JSON.parse(execFileSync('git',['show',process.env.PUBLISHED_SHA+':vercel.json'],{encoding:'utf8'}));
          const current=JSON.parse(fs.readFileSync('vercel.json','utf8'));
          baseline.git.deploymentEnabled.main=false;
          if(JSON.stringify(baseline)!==JSON.stringify(current)){
            throw new Error('Vercel mudou fora da trava main=false');
          }
          console.log('Sincronizacao auditada: codigo funcional identico ao SHA publicado; main sem autodeploy.');
          NODE

  release-gate:
    name: Gate de evidencias (NO-GO ate liberacao)
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.number == 83 && github.head_ref == 'preparacao/auditoria-final-producao-20261125') }}
    needs: [candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Exigir evidências do release incremental
        env:
          NEO_PEP_PR_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$NEO_PEP_PR_BRANCH" == 'release/ciclo-aprovado-20261125' ]]; then
            node scripts/release-incremental-check.cjs
          else
            npm run release:check
          fi
