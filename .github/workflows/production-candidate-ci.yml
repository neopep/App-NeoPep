name: Production Candidate CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Candidata sem deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Invariantes de configuracao oficial
        run: node release/production/assert-candidate.cjs
      - name: Testes focalizados
        run: node --test tests/{admin-ui,admin-pdf,community-ui,core,library-files-ui,library-sharing,ui,pwa,release-check,cloud,auth-persistence,photos,shop-payments-edge,shop-core,shop,shop-shipping,auth-settings,delete-account,production-finance-baseline,push-prod-campaign}.test.cjs
      - name: Ensaio sintético dos lotes e catálogo
        run: |
          node --test tests/production-rehearsal.test.cjs
          node release/production/test-catalog.cjs
          node --test tests/production-invariants.test.cjs
      - name: Autoteste offline de integridade do Storage restaurado
        run: python3 release/production/verify-storage-restore.py --self-test
      - name: Auditoria de dependencias
        run: npm audit --omit=dev --audit-level=high

  release-gate:
    name: Gate de evidencias (NO-GO ate liberacao)
    needs: [candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Exigir release-readiness verificado
        run: npm run release:check
