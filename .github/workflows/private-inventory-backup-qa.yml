name: NeoPep - QA backup privado
on:
  push:
    branches:
      - desenvolvimento/backup-privado-catalogo
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    if: github.ref == 'refs/heads/desenvolvimento/backup-privado-catalogo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: node --test tests/private-inventory-backup.test.cjs
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
