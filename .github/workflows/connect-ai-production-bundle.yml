name: NeoPep Connect AI production bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    if: github.repository == 'neopep/App-NeoPep' && github.event.repository.visibility == 'private' && github.ref == 'refs/heads/desenvolvimento/campanhas-plugin-ia-20261126'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix integrations/campaign-mcp
      - name: Build and verify
        run: bash integrations/campaign-mcp/build-production-bundle.sh "$RUNNER_TEMP/neopep-connect-ai-production"
      - uses: actions/upload-artifact@v4
        with:
          name: neopep-connect-ai-production-${{ github.sha }}
          path: ${{ runner.temp }}/neopep-connect-ai-production/
          if-no-files-found: error
          retention-days: 7
