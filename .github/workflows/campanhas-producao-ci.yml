name: Candidata consolidada de campanhas (sem deploy)
on:
  push:
    branches: [preparacao/campanhas-producao-20261125]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: campanhas-producao-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: node release/production/assert-candidate.cjs
      - run: npm test
      - run: node --test connect/windows/campaign-worker-optin.test.cjs connect/windows/rich-campaign-contract.test.cjs connect/windows/production-update-contract.test.cjs
