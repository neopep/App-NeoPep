<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111210">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Pagamento — NeoPeptídeos</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <style>
    body.payment-return{min-height:100dvh;display:grid;place-items:center;padding:24px;background:#111210}
    .payment-return-main{width:min(100%,520px)}
    .payment-return-brand{display:flex;align-items:center;gap:12px;margin:0 0 24px;color:var(--ink);font-size:19px;font-weight:700}
    .payment-return-brand img{width:42px;height:42px;border-radius:12px}
    .payment-return-card{text-align:center;padding:34px 28px}
    .payment-return-mark{width:66px;height:66px;display:grid;place-items:center;margin:0 auto 20px;border-radius:50%;background:rgba(222,185,105,.16);border:1px solid rgba(222,185,105,.5);font-size:30px;color:#e6c77f;transition:.3s ease}
    .payment-return-mark.confirmed{background:rgba(78,180,111,.16);border-color:rgba(78,180,111,.55);color:#9ee0ad}
    .payment-return-card h1{font-size:27px;margin-bottom:12px}
    .payment-return-card .sub{font-size:14px;line-height:1.7}
    .payment-return-progress{height:7px;margin:25px 0 0;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.1)}
    .payment-return-progress span{display:block;width:35%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#e4c477,#f4dfa9);animation:return-loading 1.1s ease-in-out infinite}
    .payment-return-progress.complete span{width:100%;background:#72ba86;animation:none;transform:none}
    @keyframes return-loading{0%{transform:translateX(-110%)}100%{transform:translateX(390%)}}
    .payment-return-help{margin:24px 0 0;padding:16px;border:1px solid var(--border);border-radius:16px;background:rgba(255,255,255,.035);font-size:13px;line-height:1.6;color:var(--ink)}
  </style>
</head>
<body class="payment-return">
  <main class="payment-return-main">
    <div class="payment-return-brand"><img src="assets/icon.svg" alt=""><span>NeoPeptídeos</span></div>
    <section class="card payment-return-card" aria-live="polite">
      <div class="payment-return-mark" data-return-mark>…</div>
      <h1 data-return-title>Confirmando pagamento</h1>
      <p class="sub" data-return-message>Aguarde enquanto concluímos o retorno do Mercado Pago.</p>
      <div class="payment-return-progress" data-return-progress role="progressbar" aria-label="Confirmando pagamento"><span></span></div>
      <p class="payment-return-help" data-return-help>Depois da confirmação, feche esta tela do navegador e abra novamente o NeoPeptídeos pelo ícone instalado.</p>
    </section>
  </main>
  <script src="payment-return.js"></script>
</body>
</html>
